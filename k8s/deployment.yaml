apiVersion: apps/v1
kind: Deployment
metadata:
  name: onlinestore-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: onlinestore-api
  template:
    metadata:
      labels:
        app: onlinestore-api
    spec:
      containers:
        - name: onlinestore-api
          image: acronlinestorebalaji.azurecr.io/onlinestore-api:v1
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: onlinestore-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
